[project]
name = "pytest-playwright-artifacts"
version = "0.3.1"
description = "Capture screenshots, HTML, and console logs on Playwright test failures"
keywords = ["pytest-plugin", "playwright", "test-artifacts", "debugging"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "playwright>=1.40.0",
 "pytest-plugin-utils>=0.2.0",
 "structlog>=25.5.0",
]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/pytest-playwright-artifacts" }

[project.entry-points."pytest11"]
playwright_artifacts = "pytest_playwright_artifacts.plugin"

[build-system]
requires = ["uv_build>=0.10.0,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[tool.uv.sources]

[dependency-groups]
dev = [
    "pytest-playwright>=0.5.0",
    "pytest-cov>=4.0.0",
    "pytest>=8.3.4",
    "pyright[nodejs]>=1.1.408",
    "ruff>=0.15.0",
    "coverage>=7.13.4",
    "pytest-cov>=7.0.0",
    "covdefaults>=2.3.0",
]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html:tmp/htmlcov"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["pytest_playwright_artifacts"]

[tool.coverage.report]
fail_under = 50

[tool.ruff]
extend-exclude = ["playground.py", "playground/"]
