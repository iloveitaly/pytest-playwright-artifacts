[project]
name = "pytest-playwright-artifacts"
version = "0.1.0"
description = "Pytest plugin to capture Playwright console logs and create failure artifacts (HTML, screenshots, logs)"
keywords = ["pytest", "playwright", "testing", "artifacts"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.56.0",
    "pytest>=9.0.1",
]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/pytest-playwright-artifacts" }

# additional packaging information: https://packaging.python.org/en/latest/specifications/core-metadata/#license
[project.entry-points.pytest11]
playwright_artifacts = "pytest_playwright_artifacts"

[build-system]
requires = ["uv_build>=0.8.11,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pyright>=1.1.380",
    "ruff>=0.8.0",
    "pytest-playwright>=0.3.0",
]

